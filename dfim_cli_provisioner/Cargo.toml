[package]
name = "dfim_cli_provisioner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DFIM Ring-3 host provisioning tool — generates .dfim boot sidecars"
publish = false
build = "build.rs"

[[bin]]
name = "dfim-provisioner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dfim_core_engine = { workspace = true }
dfim_host_init = { workspace = true }
dfim_windows_uefi = { workspace = true }
litcrypt = { workspace = true }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7.7.0", optional = true }

[features]
default = []
production = ["dfim_host_init/production"]
tpm = ["dep:tss-esapi"]

[dev-dependencies]
dfim_windows_uefi = { workspace = true }

