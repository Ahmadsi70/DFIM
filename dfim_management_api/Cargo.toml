[package]
name = "dfim_management_api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DFIM Central Management API — Phase 5 Production: PostgreSQL + JWT Auth + Rate Limiting"

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono"] }
hmac = "0.12"
base64 = "0.22"
subtle = "2"
getrandom = "0.2"
