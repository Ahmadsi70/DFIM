# DFIM Production Stack
# docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: dfim-postgres
    environment:
      POSTGRES_USER: dfim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: dfim_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfim"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  dfim-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: dfim-api
    environment:
      DFIM_API_BIND: 0.0.0.0:3000
      DFIM_JWT_SECRET: ${DFIM_JWT_SECRET:?set DFIM_JWT_SECRET (>=32 bytes)}
      DFIM_ADMIN_USER: ${DFIM_ADMIN_USER:-admin}
      DFIM_ADMIN_PASSWORD: ${DFIM_ADMIN_PASSWORD:?set DFIM_ADMIN_PASSWORD}
      DATABASE_URL: postgres://dfim:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/dfim_production
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: dfim-dashboard
    volumes:
      - ../dfim_management_api/dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - dfim-api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dfim-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - dfim-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dfim-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./grafana/dashboards/dfim-fleet.json:/etc/grafana/dashboards/dfim-fleet.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
