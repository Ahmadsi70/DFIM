name: Publish DFIM API to ghcr.io

on:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile.api"
      - "dfim_management_api/**"
      - ".github/workflows/publish.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image name (lowercase)
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${REGISTRY}/${OWNER}/dfim-management-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep 'version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ steps.image.outputs.IMAGE }}:latest
            ${{ steps.image.outputs.IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.image.outputs.IMAGE }}:${{ github.sha }}
          build-args: |
            DFIM_CRYPTO_KEY=${{ secrets.DFIM_CRYPTO_KEY }}