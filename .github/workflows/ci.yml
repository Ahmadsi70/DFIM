name: DFIM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Fallback for fork/dependabot PRs where secrets are unavailable (same pattern as kani.yml / fuzz.yml).
  DFIM_CRYPTO_KEY: ${{ secrets.DFIM_CRYPTO_KEY || 'ci-only-dfim-crypto-key-material-2026' }}

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Use stable toolchain (not the project's pinned 1.91.1) because
      # cargo-audit v0.22.2 pulls kstring@2.0.4 which requires rustc 1.96.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo install cargo-audit
      - run: cargo audit

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: dfim_core_engine
            test: --lib
          - crate: dfim_host_init
            test: --lib
          - crate: dfim_plugin_sdk
            test: --lib
          - crate: dfim_windows_uefi
            test: --lib
          # Bin-only crates: tests live in the binary targets.
          - crate: dfim_management_api
            test: --bins
          - crate: dfim_cli_provisioner
            test: --bins
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo build -p ${{ matrix.crate }} --release
      - run: cargo test -p ${{ matrix.crate }} ${{ matrix.test }}
      - run: cargo fmt --check -p ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} -- -D warnings

  ebpf-userspace:
    runs-on: ubuntu-latest
    env:
      # Compile-only gate: the probe object is built separately in ebpf-probe.
      DFIM_SKIP_EBPF_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo build -p dfim-ebpf-user --release
      # Bin-only crate: tests live in the binary targets, not a lib.
      - run: cargo test -p dfim-ebpf-user --bins
      - run: cargo fmt --check -p dfim-ebpf-user
      - run: cargo clippy -p dfim-ebpf-user --bins -- -D warnings

  ebpf-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src, rustfmt
      - name: Type-check eBPF probe for bpfel-unknown-none
        shell: bash
        env:
          # Runner BTF may be absent or unparsable; fall back to placeholder offsets.
          DFIM_ALLOW_UNVERIFIED_BTF_FALLBACK: "1"
        run: |
          sep=$'\x1f'
          export CARGO_ENCODED_RUSTFLAGS="--cfg=bpf_target_arch=\"x86_64\"${sep}-Cdebuginfo=2${sep}-Clink-arg=--btf${sep}-Cllvm-args=-bpf-stack-size=16384"
          rustup run nightly cargo check --package dfim-ebpf -Z build-std=core --bins --release --target bpfel-unknown-none
      - run: cargo fmt --check -p dfim-ebpf

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfim
          POSTGRES_PASSWORD: dfim_prod_2026
          POSTGRES_DB: dfim_production
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p dfim_core_engine --test integration_tests

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [parse_block_stream, parse_boot_manifest, parse_rollback_baseline, parse_authenticated_state_db]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300

  benchmark:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfim
          POSTGRES_PASSWORD: dfim_prod_2026
          POSTGRES_DB: dfim_production
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build -p dfim_management_api --release
      - name: Start API server
        env:
          DATABASE_URL: postgres://dfim:dfim_prod_2026@localhost:5432/dfim_production
          DFIM_API_BIND: 0.0.0.0:3000
        run: |
          ./target/release/dfim_management_api &
          echo $! > /tmp/dfim-api.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health 2>/dev/null && break || sleep 1
          done
      - name: Run HTTP benchmark
        env:
          DATABASE_URL: postgres://dfim:dfim_prod_2026@localhost:5432/dfim_production
        run: python3 tools/dfim_http_benchmark.py
      - name: Stop API server
        if: always()
        run: kill $(cat /tmp/dfim-api.pid) 2>/dev/null || true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install cargo-cyclonedx
      - run: cargo cyclonedx --all --spec-version 1.5
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "*.cdx.json"
