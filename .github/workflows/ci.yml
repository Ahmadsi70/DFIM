name: DFIM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DFIM_CRYPTO_KEY: ${{ secrets.DFIM_CRYPTO_KEY }}

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install cargo-audit
      - run: cargo audit

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [dfim_core_engine, dfim_management_api, dfim_plugin_sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo build -p ${{ matrix.crate }} --release
      - run: cargo test -p ${{ matrix.crate }} --lib
      - run: cargo fmt --check -p ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} -- -D warnings

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfim
          POSTGRES_PASSWORD: dfim_prod_2026
          POSTGRES_DB: dfim_production
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p dfim_core_engine --test integration_tests

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [parse_block_stream, parse_boot_manifest, parse_rollback_baseline, parse_authenticated_state_db]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300

  benchmark:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build -p dfim_management_api --release
      - run: python3 tools/dfim_http_benchmark.py

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install cargo-cyclonedx
      - run: cargo cyclonedx --all --spec-version 1.5
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*.cdx.json"
