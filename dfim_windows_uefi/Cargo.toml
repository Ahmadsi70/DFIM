[package]
name = "dfim_windows_uefi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DFIM Windows UEFI Ring-1 boot guard — intercepts bootmgfw.efi before NT kernel init"
publish = false

[lib]
name = "dfim_windows_uefi"
path = "src/lib.rs"
test = true

[[bin]]
name = "dfim_windows_uefi"
path = "src/main.rs"
test = false
required-features = ["uefi-app"]

[dependencies]
dfim_core_engine = { workspace = true }
log = { version = "0.4", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }

[dependencies.uefi]
version = "0.36.1"
optional = true
default-features = false
features = ["alloc", "logger", "panic_handler"]

[features]
default = []
uefi-app = ["dep:uefi"]
