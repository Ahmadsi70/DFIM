allow_repo_commands: true

commands:
  test: cargo test --no-fail-fast -p dfim_core_engine -p dfim_cli_provisioner -p dfim_host_init -p dfim_windows_uefi -p dfim_management_api
  lint: cargo clippy -p dfim_core_engine -p dfim_cli_provisioner -p dfim_host_init -p dfim_windows_uefi -p dfim_management_api --all-targets -- -D warnings

ignore_patterns:
  - "target/**"
  - "fuzz/target/**"
